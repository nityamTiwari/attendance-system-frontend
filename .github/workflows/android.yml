name: Android CI

on:
  push:
    branches:
      - master
    pull_request:
      branches:
        - master
        - dev-team


jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set Up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.12"
          bundler-cache: false


      - name: Configure Bundler
        run: |
          bundle config set --local path vendor/bundle

      - name: Install Fastlane dependencies
        run: bundle install

      - name: Run Test
        run: bundle exec fastlane test

      - name: Restore Android Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/attendance-upload.jks"

      - name: Create Firebase Account
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
           printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json" 

      - name: Build and Distribute APK
        env:
          ATTENDANCE_KEYSTORE_PATH: ${{ runner.temp }}/attendance-upload.jks
          ATTENDANCE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ATTENDANCE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ATTENDANCE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

          FIREBASE_APP_ID:  ${{ secrets.FIREBASE_APP_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json

        run: |
          bundle exec fastlane internal

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: attendance-system-release
          path: app/build/outputs/apk/release/app-release.apk

