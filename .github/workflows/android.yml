name: Android CI

on:
  push:
    branches:
      - master
    pull_request:
      branches:
        - master


jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore Android Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/attendance-upload.jks"

      - name: Run Unit Test
        run: ./gradlew test

      - name: Build Release AAB
        env:
          ATTENDANCE_KEYSTORE_PATH: ${{ runner.temp }}/attendance-upload.jks
          ATTENDANCE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ATTENDANCE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ATTENDANCE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run:
          ./gradlew bundleRelease






